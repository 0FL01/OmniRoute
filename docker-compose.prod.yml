# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — Docker Compose (Production Snapshot)
# ──────────────────────────────────────────────────────────────────────
#
#  Isolated production instance bound to loopback ports 20130/20131.
#  Uses a local Muse 1.3 hotfix derived from the official 3.8.50 web image.
#
#  Usage:
#    docker compose -p omniroute -f docker-compose.prod.yml build --pull omniroute-prod
#    docker compose -p omniroute -f docker-compose.prod.yml up -d --no-deps --no-build --pull never --force-recreate --wait omniroute-prod
#    docker compose -p omniroute -f docker-compose.prod.yml logs -f omniroute-prod
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Redis (Rate Limiter Backend) ──────────────────────────────────
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-redis-prod
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute-prod:
    container_name: omniroute-prod
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.muse-hotfix
    image: omniroute:3.8.50-muse13
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - CODEX_CLIENT_VERSION=0.153.4
      - OMNIROUTE_CHAT_ADMISSION_QUEUE_MS=30000
      - FETCH_BODY_TIMEOUT_MS=180000
      - STREAM_IDLE_TIMEOUT_MS=180000
      - STREAM_THROUGHPUT_WATCHDOG_ENABLED=true
      - STREAM_THROUGHPUT_WATCHDOG_WARMUP_MS=60000
      - STREAM_THROUGHPUT_WATCHDOG_WINDOW_MS=60000
    ports:
      - "127.0.0.1:${PROD_DASHBOARD_PORT:-20130}:${DASHBOARD_PORT:-${PORT:-20128}}"
      - "127.0.0.1:${PROD_API_PORT:-20131}:${API_PORT:-20129}"
    volumes:
      - omniroute-prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omniroute-prod-data:
    name: omniroute-prod-data
  redis-prod-data:
    name: redis-prod-data
